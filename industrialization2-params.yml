# ========= MANDATORY INPUTS =========
# A unique identifier for the workflow run - will be prepended to all artifact names
runId: industrialization2

# Path to where all the outputs will be saved
outputDir: /cluster/work/bokulich/schaererm/industrialization2/output

# Singularity parameters: path to the SIF image, additional volume mounts and other options
container: /cluster/work/bokulich/SINGULARITY_IMGS/moshpit-2026.7.0.sif
# Optional per-plugin overrides (default to container when unset)
#containerAnnotate: /path/to/annotate.sif
#containerAssembly: /path/to/assembly.sif
#containerMag: /path/to/mag.sif
#containerCheckM: /path/to/checkm.sif
#containerSkani: /path/to/skani.sif
#containerSourmash: /path/to/sourmash.sif
#containerHumann3: /path/to/humann3.sif
#containerFastp: /path/to/fastp.sif
additionalVolumeMounts: "-B /cluster/work/bokulich/DATABASES"
#additionalContainerOptions: "additional options to be passed to Singularity"

# Name of the HPC module granting Internet access
internetModule: eth_proxy

# Path to the conda environment
#condaEnv: /cluster/project/bokulich/schaererm/_conda_envs/rachis-moshpit-2026.7

# E-mail address required by q2-fondue
email: schaererm@ethz.ch

# Archive the per-sample caches upon completion
archive: true

retain:
  input: true
#  subsampling: true
  fastp: false
  host_removal: true

# ============ INPUT DATA ============
# Option 1: import reads using a manifest file
#inputReadsManifest: /path/to/manifest
# Option 2: provide a key to an existing reads artifact
#inputReads: <reads cache key>
#inputReadsCache: /path/to/reads/
#metadata: /path/to/metadata

# Option 3: provide a file with a list of IDs for fondue to fetch
fondueAccessionIds: /cluster/scratch/schaererm/industrialization2/data/industrialization2_accessions.tsv

# Option 4: provide a path to genomes from which the reads should be simulated
# If the path is not specified, a random selection of genomes will be fetched from NCBI
#read_simulation:
  #samples: /path/to/samples.tsv
  #seed: 100
  #clusterOptions: ""

# ============= DATABASES =============
databases:
  hostRemoval:
    cache:  /cluster/work/bokulich/DATABASES/QIIME2_CACHE
    key:    pangenome_grch38_index
  kraken2:
    cache:  /cluster/work/bokulich/DATABASES/QIIME2_CACHE
    key:    kraken2_pluspfp
    #fetchCollection: ""
  bracken:
    cache:  /cluster/work/bokulich/DATABASES/QIIME2_CACHE
    key:    bracken_pluspfp
#  kaiju:
#    cache:  ""
#    key:    ""
#    databaseType: ""
  busco:
    #cache:  ""
    #key:    ""
    fetchLineages: "bacteria_odb12,fungi_odb12,archaea_odb12"
#  checkm:
#    path: ""
  eggnogOrthologs:
    cache:  /cluster/work/bokulich/DATABASES/QIIME2_CACHE
    key:    eggnog_diamond_full
  eggnogAnnotations:
    cache:  /cluster/work/bokulich/DATABASES/QIIME2_CACHE
    key:    eggnog_annot_full
#  humann3Chocophlan:
#    cache:  ""
#    key:    ""
#  humann3TranslatedSearch:
#    cache:  ""
#    key:    ""
#    build: "uniref90_diamond"
#  humann3Metaphlan:
#    cache:  ""
#    key:    ""
#    index: "latest"
#    cpus: 1

# ======== ANALYSIS PARAMETERS ========
fondue:
  paired: true
  clusterOptions: ""

#read_subsampling:
#  enabled: false
#  paired: true
#  fraction: 0.8

read_qc:
  fastp:
    disableQualityFiltering: false
    deduplicate: false
    disableAdapterTrimming: false
    enableBaseCorrection: false
    additionalFlags: "--p-qualified-quality-phred 30"

host_removal:
  enabled: true
  human: true
  clusterOptions: ""
  mode: "local"
  sensitivity: "sensitive"
  ref_gap_open_penalty: 5
  ref_gap_ext_penalty: 3

#sample_filtering:
#  enabled: false
#  min_reads: 4200000

genome_assembly:
  enabled: true
  clusterOptions: ""
  assembler: "megahit"
  fetchArtifact: false
  megahit:
    presets: "disabled"
    kList: "21 29 39 59 79 99 119 141"
    minContigLen: 200
    additionalFlags: ""
#  spades:
#    k: "auto"
#    debug: false
#    covCutoff: "off"
#    additionalFlags: "--p-meta"
  filtering:
    enabled: true
    removeEmpty: true
    lengthThreshold: 500

assembly_qc:
  enabled: true
  quast:
    enabled: true
    useMappedReads: false
    additionalFlags: ""

binning:
  enabled: true
  primary: metabat2
  fetchArtifact: false
  metabat2:
    enabled: true
    clusterOptions: ""
    min_contig: 1500
    seed: 67
    additionalFlags: ""
#  semibin2:
#    enabled: false
#    clusterOptions: ""
#    environment: global
#    training_type: semi
#    min_len: 1500
#    epochs: 15
#    batch_size: 2048
#    random_seed: 100
#    additionalFlags: ""
  qc:
    busco:
      enabled: true
      clusterOptions: ""
      mode: "genome"
      lineageDatasets: "bacteria_odb12,fungi_odb12,archaea_odb12"
      selectLineage: "bacteria_odb12"
      additionalFlags: ""
      cleanUp: false
      fetchArtifact: false
#    checkm:
#      enabled: false
#      reducedTree: false
#      clusterOptions: ""
#      additionalFlags: ""
    filtering:
      enabled: true
      condition: "complete>=50 AND duplicated<=10 AND dataset='bacteria_odb12'"
      exclude_ids: false
      fetchArtifact: false

dereplication:
  enabled: true
  method: "sourmash" # sourmash, skani
  clusterOptions: ""
  threshold: 0.99
  fetchArtifact: false
  sourmash:
    clusterOptions: ""
    ksizes: 35
    scaled: 100
    trackAbundance: true
#  skani:
#    clusterOptions: ""
#    preset: "slow"
#    markerC: 1000
#    robust: true
#    median: false
#    fasterSmall: false
#    additionalFlags: ""

abundance_estimation:
  enabledFor: "contigs,derep" # contigs, derep
  fetchArtifact: false
  metric: "tpm"
  min_mapq: 42
  min_query_len: 0
  min_base_quality: 0

taxonomic_classification:
  enabledFor: "reads,contigs,mags,derep" # reads, contigs, mags, derep
  fetchArtifact: false # this will fetch the taxonomies and feature tables at either of the classification steps, if available
  kraken2:
    clusterOptions: ""
    memoryMapping: false
    additionalFlags: ""
    fetchArtifact: false # this will fetch the Kraken2 reports and hits
  bracken:
    enabled: true
    clusterOptions: ""
    threshold: 0
    readLength: 100
    level: "S"
    fetchArtifact: true # this will fetch the Bracken-corrected reports
  feature_selection:
    coverageThreshold: 0.1
  kaiju:
    enabledFor: "" # reads, contigs
#    a:  "greedy"
#    evalue: 1e-05
#    m:  11
#    r: "species"
#    c: 0.0
#    u: true
#    clusterOptions: ""
#    additionalFlags: ""

functional_annotation:
  enabledFor: "contigs,mags,derep" # contigs, mags, derep
  ortholog_search:
    clusterOptions: ""
    fetchArtifact: false
    dbInMemory: true
    additionalFlags: ""
  annotation:
    clusterOptions: ""
    fetchArtifact: true
    dbInMemory: true
    additionalFlags: ""
    extract:
      types: "caz,cog,kegg_ko,ec"
      max_evalue: 0.00001
      min_score: 0
      fetchArtifact: true
  cleanUp: false
  partitionBatchCount: 10

